<!DOCTYPE html>
<html lang="en">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f9f9f8;color:#1a1a1a;min-height:100vh}
#auth-screen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;max-width:400px;margin:0 auto}
#auth-screen h1{font-size:48px;font-weight:900;color:#7F77DD;margin-bottom:.25rem;letter-spacing:-2px}
#auth-screen p{font-size:14px;color:#aaa;margin-bottom:2rem}
.auth-input{width:100%;padding:10px 14px;font-size:15px;border:0.5px solid rgba(0,0,0,0.15);border-radius:8px;background:#fff;color:#1a1a1a;margin-bottom:10px;font-family:inherit}
.auth-input:focus{outline:none;border-color:#7F77DD}
.auth-btn{width:100%;padding:12px;font-size:15px;font-weight:600;background:#7F77DD;color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:inherit;margin-bottom:8px}
.auth-btn:hover{background:#534AB7}
.auth-btn.secondary{background:transparent;color:#7F77DD;border:0.5px solid #AFA9EC}
.auth-btn.secondary:hover{background:#EEEDFE}
#auth-msg{font-size:13px;color:#888;text-align:center;margin-top:8px;min-height:20px}
#auth-msg.error{color:#e24b4a}
#auth-msg.success{color:#22a06b}
#app{padding:1.5rem;max-width:600px;margin:0 auto;display:none}
#sync-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
#sync-bar h1{font-size:22px;font-weight:500;color:#7F77DD;letter-spacing:-0.5px}
#sync-right{display:flex;align-items:center;gap:12px}
#sync-status{font-size:12px;color:#bbb;display:flex;align-items:center;gap:5px}
#sync-dot{width:7px;height:7px;border-radius:50%;background:#bbb;flex-shrink:0;transition:background .3s}
#sync-dot.online{background:#22a06b}
#sync-dot.offline{background:#f5a623}
#sync-dot.syncing{background:#7F77DD;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
#signout-btn{font-size:12px;color:#bbb;background:none;border:none;cursor:pointer;padding:2px 6px;border-radius:6px}
#signout-btn:hover{background:#f0f0f0;color:#666}
#xp-meta{display:flex;justify-content:space-between;font-size:13px;color:#888;margin-bottom:6px}
#xp-bar-bg{height:8px;background:#eee;border-radius:4px;overflow:hidden;margin-bottom:1.5rem}
#xp-bar-fill{height:100%;background:#7F77DD;border-radius:4px;transition:width 0.4s ease}
#mini-cel{background:#f0effe;border-radius:8px;padding:8px 16px;font-size:14px;font-weight:500;color:#534AB7;display:none;text-align:center;margin-bottom:1rem}
#active-card{background:#fff;border:0.5px solid rgba(0,0,0,0.12);border-radius:12px;padding:1.5rem;margin-bottom:1rem}
#peek-section{margin-bottom:1rem}
#peek-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
#peek-label{font-size:12px;color:#aaa;letter-spacing:.04em}
#peek-toggle{background:none;border:none;cursor:pointer;font-size:12px;color:#aaa;display:flex;align-items:center;gap:4px;padding:2px 6px;border-radius:8px}
#peek-toggle:hover{background:#f5f5f4;color:#666}
.peek-card{background:#fff;border:0.5px solid rgba(0,0,0,0.12);border-radius:8px;padding:10px 14px;margin-bottom:6px;cursor:grab;user-select:none;transition:opacity 0.15s}
.peek-card.dragging{opacity:0.4;cursor:grabbing}
.peek-card.drag-over{border-color:#7F77DD;border-style:dashed}
.drag-handle{color:#ccc;font-size:16px;cursor:grab;padding:0 4px;flex-shrink:0}
.peek-header-row{display:flex;align-items:center;gap:8px}
.peek-n{font-size:12px;color:#bbb;min-width:18px}
.peek-t{font-size:14px;color:#666;flex:1}
.peek-d{font-size:12px;color:#bbb}
.peek-subs{margin-top:6px;padding-top:6px;border-top:0.5px solid rgba(0,0,0,0.08)}
.peek-sub-row{display:flex;align-items:center;gap:6px;padding:3px 0}
.peek-sub-dot{width:6px;height:6px;border-radius:50%;background:#ddd;flex-shrink:0;margin-left:18px}

.sq-input{flex:1;padding:6px 10px;font-size:13px;border:0.5px solid rgba(0,0,0,0.15);border-radius:8px;background:#f5f5f4;color:#1a1a1a;font-family:inherit}
.sq-input:focus{outline:none;border-color:#7F77DD}
.sq-textarea{width:100%;padding:8px 10px;font-size:13px;border:0.5px solid rgba(0,0,0,0.15);border-radius:8px;background:#f5f5f4;color:#1a1a1a;resize:vertical;min-height:72px;font-family:inherit}
.sq-textarea:focus{outline:none;border-color:#7F77DD}
.sq-save-btn{padding:6px 12px;background:#7F77DD;color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit}

.sq-cancel-btn{padding:6px 10px;background:transparent;border:0.5px solid rgba(0,0,0,0.2);border-radius:8px;font-size:13px;color:#666;cursor:pointer;font-family:inherit}
.sq-cancel-btn:hover{background:#f5f5f4}
.add-sq-btn{margin-top:8px;padding:5px 12px;font-size:12px;color:#7F77DD;background:transparent;border:0.5px solid #AFA9EC;border-radius:8px;cursor:pointer;font-family:inherit}
.add-sq-btn:hover{background:#EEEDFE}
.icon-btn{background:none;border:none;cursor:pointer;padding:3px 5px;color:#bbb;font-size:14px;border-radius:8px}
.icon-btn:hover{background:#f5f5f4;color:#888}
.action-btns{display:flex;gap:6px;margin-top:8px}
.action-btn{padding:4px 10px;font-size:12px;color:#666;background:transparent;border:0.5px solid rgba(0,0,0,0.2);border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:4px;font-family:inherit}
.action-btn:hover{background:#f5f5f4}
.action-btn.active{background:#EEEDFE;border-color:#AFA9EC;color:#534AB7}
.att-block{margin-top:8px;padding:8px 10px;background:#f5f5f4;border-radius:8px;border:0.5px solid rgba(0,0,0,0.1)}

.att-row:last-child{border-bottom:none}
.att-text{font-size:13px;color:#555;flex:1;line-height:1.4;word-break:break-word}
.att-link{font-size:13px;color:#7F77DD;flex:1;word-break:break-all;text-decoration:none}
.att-link:hover{text-decoration:underline}
.att-del{background:none;border:none;cursor:pointer;color:#bbb;font-size:13px;padding:1px 3px;border-radius:4px;flex-shrink:0}
.att-del:hover{color:#e24b4a}
.inline-form{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.inline-form-btns{display:flex;gap:6px}
#add-row{display:flex;flex-direction:row;align-items:stretch;gap:10px;margin-bottom:1.5rem}
#new-task{flex:1;padding:10px 14px;font-size:16px;border:0.5px solid rgba(0,0,0,0.15);border-radius:8px;background:#fff;color:#1a1a1a;height:100px;font-family:inherit}
#new-task:focus{outline:none;border-color:#7F77DD}
#new-task::placeholder{color:#bbb}
#btn-add{width:100px;height:100px;border-radius:12px;background:#7F77DD;border:none;cursor:pointer;color:#F5C400;flex-shrink:0;transition:transform 0.1s;display:flex;align-items:center;justify-content:center;overflow:hidden}

#btn-add:active{transform:scale(0.93)}
#btn-add span{font-size:80px;font-weight:900;line-height:1;color:#F5C400;pointer-events:none;user-select:none;display:block}
#done-recent,#done-earlier{border-top:0.5px solid rgba(0,0,0,0.1);padding-top:1rem;margin-top:1rem}
.done-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.done-label{font-size:12px;color:#bbb;letter-spacing:.06em;text-transform:uppercase}
.done-toggle{background:none;border:none;cursor:pointer;font-size:12px;color:#bbb;display:flex;align-items:center;gap:4px;padding:2px 6px;border-radius:8px}
.done-toggle:hover{background:#f5f5f4;color:#666}
#later-section{margin-top:1.5rem;border-top:0.5px solid rgba(0,0,0,0.1);padding-top:1rem}
.task-datetime{font-size:12px;color:#7F77DD;text-align:center;margin-bottom:6px;font-weight:500;letter-spacing:.02em}
.datetime-date{color:#7F77DD}
.datetime-time{color:#9B77DD}
.datetime-sep{color:#bbb;margin:0 4px}
#later-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
#later-label{font-size:12px;color:#aaa;letter-spacing:.06em;font-weight:600}
#later-toggle{background:none;border:none;cursor:pointer;font-size:12px;color:#aaa;display:flex;align-items:center;gap:4px;padding:2px 6px;border-radius:8px}
#later-toggle:hover{background:#f5f5f4;color:#666}
.later-card{background:#fff;border:0.5px solid rgba(0,0,0,0.08);border-radius:8px;padding:10px 14px;margin-bottom:6px}
.later-text{font-size:14px;color:#888;flex:1}
.later-row{display:flex;align-items:center;gap:8px}
.move-btn{margin-top:6px;padding:4px 10px;font-size:12px;color:#7F77DD;background:transparent;border:0.5px solid #AFA9EC;border-radius:8px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:4px;margin-left:auto}
.move-btn:hover{background:#EEEDFE}
.del-btn{padding:4px 8px;font-size:13px;color:#ccc;background:transparent;border:none;border-radius:8px;cursor:pointer;font-family:inherit;display:flex;align-items:center;flex-shrink:0}
.del-btn:hover{color:#e24b4a;background:#fff0f0}
.del-confirm{display:flex;align-items:center;gap:6px;flex-shrink:0}
.del-confirm-yes{padding:3px 10px;font-size:12px;font-weight:600;color:#fff;background:#e24b4a;border:none;border-radius:8px;cursor:pointer;font-family:inherit}
.del-confirm-yes:hover{background:#c93a3a}
.del-confirm-no{padding:3px 10px;font-size:12px;color:#888;background:transparent;border:0.5px solid rgba(0,0,0,0.2);border-radius:8px;cursor:pointer;font-family:inherit}
.del-confirm-no:hover{background:#f5f5f4}
#later-add-row{margin-top:8px}
#later-task{width:100%;padding:8px 12px;font-size:14px;border:0.5px solid rgba(0,0,0,0.12);border-radius:8px;background:#f9f9f8;color:#1a1a1a;font-family:inherit}
#later-task:focus{outline:none;border-color:#7F77DD}
#later-task::placeholder{color:#bbb}
.done-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:0.5px solid rgba(0,0,0,0.06)}
.done-row:last-child{border-bottom:none}
.done-emoji{font-size:16px;flex-shrink:0}
.done-text{font-size:13px;color:#bbb;text-decoration:line-through;flex:1}
@media(prefers-color-scheme:dark){
  body{background:#1a1918;color:#e8e6e0}
  #active-card,.peek-card{background:#242320;border-color:rgba(255,255,255,0.1)}
  #new-task{background:#242320;color:#e8e6e0;border-color:rgba(255,255,255,0.12)}
  #new-task::placeholder{color:#666}
  .sq-input,.sq-textarea{background:#2e2c2a;color:#e8e6e0;border-color:rgba(255,255,255,0.12)}
  .sq-cancel-btn,.action-btn,.icon-btn,.add-sq-btn{color:#aaa;border-color:rgba(255,255,255,0.15)}
  .sq-cancel-btn:hover,.action-btn:hover,.icon-btn:hover{background:#2e2c2a}
  .att-block{background:#2e2c2a;border-color:rgba(255,255,255,0.08)}
  .att-text{color:#aaa}.peek-t{color:#aaa}.peek-d,.peek-n{color:#666}.peek-sub-lbl{color:#666}
  #mini-cel{background:#2e2a4e;color:#AFA9EC}
  #xp-bar-bg{background:#2e2c2a}
  .auth-input{background:#242320;color:#e8e6e0;border-color:rgba(255,255,255,0.12)}
  #signout-btn:hover{background:#2e2c2a;color:#aaa}
}
</style>

<body>

<div id="auth-screen">

<div id="app">
  <div id="sync-bar">
    <h1>Quest!</h1>
    <div id="sync-right">
      <div id="sync-status"><div id="sync-dot"></div><span id="sync-text">...</span></div>

  <div id="xp-bar-bg"><div id="xp-bar-fill" style="width:0%"></div></div>
  <div id="mini-cel"></div>
  <div id="active-card"></div>

    <input id="new-task" placeholder="Next quest..."/>

</div>

<script>
// ── Supabase REST API (no library — direct fetch) ───────────────────────────
const BASE='https://himgzvlazranikukuztq.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhpbWd6dmxhenJhbmlrdWt1enRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNTgwMDksImV4cCI6MjA5MzczNDAwOX0.LcBiSIkHUH8HamG1H0Yap4D-Sw1_olQvJgAQsr4Hv8s';

let accessToken=null;
let currentUser=null;

function authHeaders(){
  return{
    'Content-Type':'application/json',
    'apikey':ANON,
    'Authorization':'Bearer '+(accessToken||ANON)
  };
}

async function apiSignIn(email,password){
  const r=await fetch(BASE+'/auth/v1/token?grant_type=password',{
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':ANON},
    body:JSON.stringify({email,password})
  });
  const d=await r.json();
  if(!r.ok)throw new Error(d.error_description||d.msg||'Sign in failed');
  return d;
}

async function apiSignUp(email,password){
  const r=await fetch(BASE+'/auth/v1/signup',{
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':ANON},
    body:JSON.stringify({email,password})
  });
  const d=await r.json();
  if(!r.ok)throw new Error(d.error_description||d.msg||'Sign up failed');
  return d;
}

async function apiLoadQuests(){
  const r=await fetch(BASE+'/rest/v1/quests?user_id=eq.'+currentUser.id+'&select=*',{
    headers:authHeaders()
  });
  if(!r.ok)throw new Error('Load failed: '+r.status);
  return await r.json();
}

async function apiUpsertQuest(taskId,taskData){
  const r=await fetch(BASE+'/rest/v1/quests',{
    method:'POST',
    headers:{...authHeaders(),'Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify({id:taskId,user_id:currentUser.id,data:taskData,updated_at:new Date().toISOString()})
  });
  if(!r.ok){const t=await r.text();throw new Error('Upsert failed: '+r.status+' '+t);}
}

async function apiDeleteQuest(taskId){
  const r=await fetch(BASE+'/rest/v1/quests?id=eq.'+taskId+'&user_id=eq.'+currentUser.id,{
    method:'DELETE',
    headers:authHeaders()
  });
  if(!r.ok)throw new Error('Delete failed: '+r.status);
}

async function apiLoadUserData(){
  const r=await fetch(BASE+'/rest/v1/user_data?user_id=eq.'+currentUser.id+'&select=*',{headers:authHeaders()});
  if(!r.ok)throw new Error('Load user data failed: '+r.status);
  const d=await r.json();
  return d&&d.length>0?d[0]:null;
}

async function apiSaveUserData(){
  const r=await fetch(BASE+'/rest/v1/user_data',{
    method:'POST',
    headers:{...authHeaders(),'Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify({user_id:currentUser.id,xp,lvl,completed,manual_order:manualOrder||[],later_tasks:laterTasks,later_order:laterOrder||[],updated_at:new Date().toISOString()})
  });
  if(!r.ok){const t=await r.text();throw new Error('Save user data failed: '+r.status+' '+t);}
}

// ── Local state ─────────────────────────────────────────────────────────────
const STORE='ptq-tasks',STORE_XP='ptq-xp',STORE_LVL='ptq-lvl',ORDER_KEY='ptq-order',DONE_KEY='ptq-done',DIRTY_KEY='ptq-dirty',SESSION_KEY='ptq-session',LATER_KEY='ptq-later',LATER_ORDER_KEY='ptq-later-order';

let tasks=JSON.parse(localStorage.getItem(STORE)||'[]');
tasks.forEach(t=>{if(!t.notes)t.notes=[];if(!t.links)t.links=[];});
let laterTasks=JSON.parse(localStorage.getItem(LATER_KEY)||'[]');
laterTasks.forEach(t=>{if(!t.notes)t.notes=[];if(!t.links)t.links=[];});
let laterOrder=JSON.parse(localStorage.getItem(LATER_ORDER_KEY)||'null');
let xp=parseInt(localStorage.getItem(STORE_XP)||'0');
let lvl=parseInt(localStorage.getItem(STORE_LVL)||'1');
let manualOrder=JSON.parse(localStorage.getItem(ORDER_KEY)||'null');
let completed=JSON.parse(localStorage.getItem(DONE_KEY)||'[]');
let dirtyIds=new Set(JSON.parse(localStorage.getItem(DIRTY_KEY)||'[]'));
let isOnline=navigator.onLine;
let openSQ={},editingTask=null,editingSub={},dragSrcId=null,openPanel={},peekExpanded=true,touchDragSrc=null,touchDragTarget=null,laterExpanded=true,confirmDelete=null;

const EMOJIS=['🥳','🙌','🎊','🥇','💪','🎉','👏','🏆'];
const celebDone=["Quest complete! +30 XP","Victory! +30 XP","Conquered! +30 XP","Legendary! +30 XP"];
const celebAdd=["Quest unlocked! +10 XP","Challenge logged! +10 XP","Idea captured! +10 XP","Quest accepted! +10 XP"];
const celebSQ=["Side quest added! +10 XP","Side quest unlocked! +10 XP","Step logged! +10 XP"];
const celebSQDone=["Side quest done! +20 XP","Side quest slain! +20 XP","Step conquered! +20 XP"];

function saveLocal(){
  localStorage.setItem(STORE,JSON.stringify(tasks));
  localStorage.setItem(STORE_XP,String(xp));
  localStorage.setItem(STORE_LVL,String(lvl));
  localStorage.setItem(ORDER_KEY,JSON.stringify(manualOrder||[]));
  localStorage.setItem(DONE_KEY,JSON.stringify(completed));
  localStorage.setItem(DIRTY_KEY,JSON.stringify([...dirtyIds]));
  localStorage.setItem(LATER_KEY,JSON.stringify(laterTasks));
  localStorage.setItem(LATER_ORDER_KEY,JSON.stringify(laterOrder||[]));
}

function saveSession(session){
  if(session){
    localStorage.setItem(SESSION_KEY,JSON.stringify({
      access_token:session.access_token,
      user:session.user
    }));
  } else {
    localStorage.removeItem(SESSION_KEY);
  }
}

function loadSession(){
  try{
    const s=localStorage.getItem(SESSION_KEY);
    if(s){
      const parsed=JSON.parse(s);
      accessToken=parsed.access_token;
      currentUser=parsed.user;
      return true;
    }
  }catch(e){}
  return false;
}

// ── Sync ─────────────────────────────────────────────────────────────────────
async function syncToCloud(taskId){
  if(!currentUser||!isOnline)return;
  try{
    const t=tasks.find(t=>t.id===taskId);
    if(!t){
      await apiDeleteQuest(taskId);
    } else {
      await apiUpsertQuest(taskId,t);
    }
    dirtyIds.delete(taskId);
    saveLocal();
  }catch(e){
    console.warn('syncToCloud error:',e.message);
  }
}

async function syncAllDirty(){
  if(!currentUser||!isOnline||dirtyIds.size===0)return;
  setSyncStatus('syncing');
  for(const id of [...dirtyIds])await syncToCloud(id);
  setSyncStatus('online');
}

async function loadFromCloud(){
  if(!currentUser||!isOnline)return;
  setSyncStatus('syncing');
  try{
    const [rows,userData]=await Promise.all([apiLoadQuests(),apiLoadUserData()]);
    if(rows&&rows.length>0){
      tasks=rows.map(row=>({...row.data,notes:row.data.notes||[],links:row.data.links||[]}));
    }
    if(userData){
      // Always take the higher XP value to avoid losing progress
      const cloudXP=(userData.lvl||1)*100+(userData.xp||0);
      const localXP=lvl*100+xp;
      if(cloudXP>localXP){
        xp=userData.xp||0;
        lvl=userData.lvl||1;
      }
      // Merge completed: combine both lists, deduplicate by id
      const cloudCompleted=userData.completed||[];
      const localIds=new Set(completed.map(c=>c.id));
      const merged=[...completed];
      cloudCompleted.forEach(c=>{if(c.id&&!localIds.has(c.id))merged.push(c);});
      completed=merged;
      // Sync order: prefer cloud order, but only if it references the same task IDs
      if(userData.manual_order&&userData.manual_order.length>0){
        const cloudIds=new Set(userData.manual_order);
        const cloudCoverage=[...cloudIds].filter(id=>tasks.find(t=>t.id===id)).length;
        const localCoverage=[...(manualOrder||[])].filter(id=>tasks.find(t=>t.id===id)).length;
        if(cloudCoverage>=localCoverage){manualOrder=userData.manual_order;}
      }
      // Sync later tasks
      if(userData.later_tasks&&userData.later_tasks.length>0){
        laterTasks=userData.later_tasks.map(t=>({...t,notes:t.notes||[],links:t.links||[]}));
      }
      if(userData.later_order&&userData.later_order.length>0){
        laterOrder=userData.later_order;
      }
    }
    // Clean up: remove any tasks that are already in completed list
    const completedIds=new Set(completed.map(c=>c.id));
    const dirtyFromCleanup=tasks.filter(t=>completedIds.has(t.id)).map(t=>t.id);
    tasks=tasks.filter(t=>!completedIds.has(t.id));
    if(manualOrder)manualOrder=manualOrder.filter(id=>!completedIds.has(id));
    // Also remove completed items from later list
    laterTasks=laterTasks.filter(t=>!completedIds.has(t.id));
    if(laterOrder)laterOrder=laterOrder.filter(id=>!completedIds.has(id));
    // Remove tasks from NEXT that exist in LATER (LATER wins — more deliberate)
    const laterIds=new Set(laterTasks.map(t=>t.id));
    const crossDirty=tasks.filter(t=>laterIds.has(t.id)).map(t=>t.id);
    tasks=tasks.filter(t=>!laterIds.has(t.id));
    if(manualOrder)manualOrder=manualOrder.filter(id=>!laterIds.has(id));
    crossDirty.forEach(id=>{
      if(currentUser&&isOnline)apiDeleteQuest(id).catch(e=>console.warn('cross dedup:',e.message));
    });
    // Deduplicate laterTasks by id
    const seenLater=new Set();
    laterTasks=laterTasks.filter(t=>{if(seenLater.has(t.id))return false;seenLater.add(t.id);return true;});
    // Delete orphaned tasks from cloud
    dirtyFromCleanup.forEach(id=>{
      if(currentUser&&isOnline)apiDeleteQuest(id).catch(e=>console.warn('cleanup delete:',e.message));
    });
    saveLocal();
    setSyncStatus('online');
    render();
  }catch(e){
    console.warn('loadFromCloud error:',e.message);
    setSyncStatus('offline');
  }
}

function save(taskId){
  saveLocal();
  if(taskId){
    dirtyIds.add(taskId);
    localStorage.setItem(DIRTY_KEY,JSON.stringify([...dirtyIds]));
    if(isOnline&&currentUser)syncToCloud(taskId);
  }
}

function setSyncStatus(state){
  const dot=document.getElementById('sync-dot');
  const txt=document.getElementById('sync-text');
  if(!dot||!txt)return;
  dot.className='';

  else if(state==='offline'){dot.classList.add('offline');txt.textContent='Offline';}
  else{dot.classList.add('syncing');txt.textContent='Syncing...';}
}

// ── App logic ────────────────────────────────────────────────────────────────
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function getActiveSub(t){
  if(!t.subs||!t.subs.length)return null;
  const order=t.subOrder||t.subs.map((_,i)=>i);
  for(const idx of order){if(idx<t.subs.length&&!t.subs[idx].done)return idx;}
  return null;
}
function skipSub(t,idx){
  if(!t.subOrder)t.subOrder=t.subs.map((_,i)=>i);
  const pos=t.subOrder.indexOf(idx);
  if(pos>-1){t.subOrder.splice(pos,1);t.subOrder.push(idx);}
}
function getOrder(){
  const ids=tasks.map(t=>t.id);
  if(!manualOrder||!manualOrder.length){manualOrder=[...ids];return manualOrder;}
  const filtered=manualOrder.filter(id=>ids.includes(id));
  const newIds=ids.filter(id=>!filtered.includes(id));
  manualOrder=[...filtered,...newIds];return manualOrder;
}
function sorted(){return getOrder().map(id=>tasks.find(t=>t.id===id)).filter(Boolean);}
function fmtDue(d){
  if(!d)return'';
  const ms=new Date(d+'T00:00:00')-new Date(new Date().toDateString());
  const days=Math.round(ms/86400000);
  if(days<0)return'Overdue by '+Math.abs(days)+' day'+(Math.abs(days)===1?'':'s');
  if(days===0)return'Due today';if(days===1)return'Due tomorrow';
  return'Due in '+days+' days';
}
function showMini(msg,dur){
  const el=document.getElementById('mini-cel');
  el.textContent=msg;el.style.display='block';
  setTimeout(()=>{el.style.display='none';},dur||1600);
}
function gainXP(n){
  xp+=n;if(xp>=100){xp-=100;lvl++;showMini('LEVEL UP! Now LVL '+lvl,2200);}
  updateBar();saveLocal();
  if(currentUser&&isOnline)apiSaveUserData().catch(e=>console.warn('gainXP sync error:',e.message));
}
function updateBar(){
  document.getElementById('xp-left').textContent=xp+' XP';
  document.getElementById('lvl-right').textContent='LVL '+lvl;
  document.getElementById('xp-bar-fill').style.width=xp+'%';
}
function fmtTaskDateTime(t){
  if(!t.taskDate&&!t.taskTime)return null;
  const parts=[];
  if(t.taskDate){
    const d=new Date(t.taskDate+'T00:00:00');
    parts.push(d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}));
  }
  if(t.taskTime){
    const [h,m]=t.taskTime.split(':');
    const hr=parseInt(h);
    const ampm=hr>=12?'PM':'AM';
    const hr12=hr%12||12;
    parts.push(hr12+':'+(m||'00')+' '+ampm);
  }
  return parts.join(' · ');
}

function renderPeek(rest){
  const peek=document.getElementById('peek-items');peek.innerHTML='';
  const toggle=document.getElementById('peek-toggle');
  if(!rest.length){peek.innerHTML='<div style="font-size:13px;color:#bbb;padding:6px 0">Nothing else queued</div>';toggle.style.display='none';return;}
  toggle.style.display='flex';
  if(!peekExpanded)return;
  rest.forEach((t,i)=>{
    const card=document.createElement('div');card.className='peek-card';card.dataset.id=t.id;card.draggable=true;
    card.addEventListener('dragstart',e=>{dragSrcId=t.id;card.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    card.addEventListener('dragend',()=>{card.classList.remove('dragging');document.querySelectorAll('.peek-card').forEach(c=>c.classList.remove('drag-over'));});
    card.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';document.querySelectorAll('.peek-card').forEach(c=>c.classList.remove('drag-over'));card.classList.add('drag-over');});
    card.addEventListener('dragleave',()=>card.classList.remove('drag-over'));
    card.addEventListener('drop',e=>{
      e.preventDefault();card.classList.remove('drag-over');if(dragSrcId===t.id)return;
      const order=getOrder();const fromIdx=order.indexOf(dragSrcId);const toIdx=order.indexOf(t.id);
      if(fromIdx<1||toIdx<1)return;
      order.splice(fromIdx,1);order.splice(toIdx,0,dragSrcId);
      manualOrder=[...order];saveLocal();if(currentUser&&isOnline)apiSaveUserData().catch(e=>console.warn('order sync:',e.message));render();
    });
    // Touch drag for iOS — track hover target during move
    card.addEventListener('touchstart',e=>{
      touchDragSrc=t.id;
      card.classList.add('dragging');
    },{passive:true});
    card.addEventListener('touchmove',e=>{
      e.preventDefault();
      const touch=e.touches[0];
      // Temporarily hide the dragging card so elementFromPoint finds the card underneath
      card.style.pointerEvents='none';
      const el=document.elementFromPoint(touch.clientX,touch.clientY);
      card.style.pointerEvents='';
      const target=el?el.closest('.peek-card'):null;
      document.querySelectorAll('.peek-card').forEach(c=>c.classList.remove('drag-over'));
      if(target&&target!==card){target.classList.add('drag-over');touchDragTarget=target.dataset.id;}
      else{touchDragTarget=null;}
    },{passive:false});
    card.addEventListener('touchend',()=>{
      card.classList.remove('dragging');
      document.querySelectorAll('.peek-card').forEach(c=>c.classList.remove('drag-over'));
      if(touchDragSrc&&touchDragTarget&&touchDragSrc!==touchDragTarget){
        const order=getOrder();
        const fromIdx=order.indexOf(touchDragSrc);
        const toIdx=order.indexOf(touchDragTarget);
        if(fromIdx>0&&toIdx>0){
          order.splice(fromIdx,1);order.splice(toIdx,0,touchDragSrc);
          manualOrder=[...order];saveLocal();
          if(currentUser&&isOnline)apiSaveUserData().catch(e=>console.warn('touch order sync:',e.message));
          render();
        }
      }
      touchDragSrc=null;touchDragTarget=null;
    });
    const header=document.createElement('div');header.className='peek-header-row';
    const handle=document.createElement('i');handle.className='ti ti-grip-vertical drag-handle';
    if(editingTask===t.id){
      card.appendChild(makeEditInput(t.text,(val)=>{t.text=val;editingTask=null;save(t.id);render();},()=>{editingTask=null;render();},false));
    } else {
      const n=document.createElement('span');n.className='peek-n';n.textContent=i+2;
      const ts=document.createElement('span');ts.className='peek-t';ts.textContent=t.text;
      const d=document.createElement('span');d.className='peek-d';d.textContent=fmtDue(t.due);
      const eb=document.createElement('button');eb.className='icon-btn';eb.innerHTML='<i class="ti ti-edit"></i>';
      eb.onclick=(()=>{const id=t.id;return()=>{editingTask=id;render();};})();
      header.appendChild(handle);header.appendChild(n);header.appendChild(ts);header.appendChild(d);header.appendChild(eb);card.appendChild(header);
      const peekDt=fmtTaskDateTime(t);
      if(peekDt){const dtEl=document.createElement('div');dtEl.className='task-datetime';dtEl.style.textAlign='center';dtEl.textContent=peekDt;card.appendChild(dtEl);}
    }
    if(t.subs&&t.subs.length){
      const subOrder=t.subOrder||t.subs.map((_,i)=>i);
      const subsDiv=document.createElement('div');subsDiv.className='peek-subs';
      subOrder.forEach(j=>{
        const s=t.subs[j];if(!s)return;
        const row=document.createElement('div');row.className='peek-sub-row';
        if(editingSub[t.id]===j){
          row.appendChild(makeEditInput(s.text,(val)=>{s.text=val;delete editingSub[t.id];save(t.id);render();},()=>{delete editingSub[t.id];render();},false));
        } else {
          const dot=document.createElement('div');dot.className='peek-sub-dot';if(s.done)dot.style.background='#7F77DD';
          const lbl=document.createElement('span');lbl.className='peek-sub-lbl'+(s.done?' done':'');lbl.textContent=s.text;
          const eb=document.createElement('button');eb.className='icon-btn';eb.innerHTML='<i class="ti ti-edit"></i>';
          eb.onclick=(()=>{const jj=j,id=t.id;return()=>{editingSub[id]=jj;render();};})();
          row.appendChild(dot);row.appendChild(lbl);row.appendChild(eb);
        }
        subsDiv.appendChild(row);
      });
      card.appendChild(subsDiv);
    }

    card.appendChild(makeAttPanel(t));
    const btnRow=document.createElement('div');btnRow.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:4px';
    // Add side quest (bottom left)
    const sqWidget=makeSQWidget(t.id,'peek'+i);sqWidget.style.cssText='margin-top:0;flex:0 0 auto';
    // Delete button (center)
    const delWrap=document.createElement('div');delWrap.style.cssText='display:flex;align-items:center;justify-content:center;flex:1';
    if(confirmDelete===t.id){
      const yes=document.createElement('button');yes.className='del-confirm-yes';yes.textContent='Delete';
      yes.onclick=(()=>{const tid=t.id;return()=>{deleteTask(tid);};})();
      const no=document.createElement('button');no.className='del-confirm-no';no.textContent='Never mind';
      no.onclick=()=>{confirmDelete=null;render();};
      const cf=document.createElement('div');cf.className='del-confirm';cf.appendChild(no);cf.appendChild(yes);
      delWrap.appendChild(cf);
    } else {
      const delBtn=document.createElement('button');delBtn.className='del-btn';
      delBtn.innerHTML='<i class="ti ti-trash" style="font-size:14px"></i>';
      delBtn.onclick=(()=>{const tid=t.id;return()=>{confirmDelete=tid;render();};})();
      delWrap.appendChild(delBtn);
    }
    // Move to LATER (right)
    const moveLaterBtn=document.createElement('button');moveLaterBtn.className='move-btn';
    moveLaterBtn.style.cssText='margin-top:0;margin-left:0;flex:0 0 auto';
    moveLaterBtn.innerHTML='<i class="ti ti-arrow-down" style="font-size:12px"></i>Move to LATER';
    moveLaterBtn.onclick=(()=>{const tid=t.id;return()=>{moveToLater(tid);};})();

function getLaterOrder(){
  const ids=laterTasks.map(t=>t.id);
  if(!laterOrder||!laterOrder.length){laterOrder=[...ids];return laterOrder;}
  const filtered=laterOrder.filter(id=>ids.includes(id));
  const newIds=ids.filter(id=>!filtered.includes(id));
  laterOrder=[...filtered,...newIds];return laterOrder;
}

    }
    const laterDt=fmtTaskDateTime(t);
    if(laterDt){const dtEl=document.createElement('div');dtEl.className='task-datetime';dtEl.textContent=laterDt;card.appendChild(dtEl);}
    // Side quests
    if(t.subs&&t.subs.length){
      const subOrder=t.subOrder||t.subs.map((_,i)=>i);
      const subsDiv=document.createElement('div');subsDiv.className='peek-subs';
      subOrder.forEach(j=>{
        const s=t.subs[j];if(!s)return;
        const srow=document.createElement('div');srow.className='peek-sub-row';
        if(editingSub[t.id]===j){
          srow.appendChild(makeEditInput(s.text,(val)=>{s.text=val;delete editingSub[t.id];saveLater();renderLater();},()=>{delete editingSub[t.id];renderLater();},false));
        } else {
          const dot=document.createElement('div');dot.className='peek-sub-dot';if(s.done)dot.style.background='#7F77DD';
          const lbl=document.createElement('span');lbl.className='peek-sub-lbl'+(s.done?' done':'');lbl.textContent=s.text;
          const eb=document.createElement('button');eb.className='icon-btn';eb.innerHTML='<i class="ti ti-edit"></i>';
          eb.onclick=(()=>{const jj=j,id=t.id;return()=>{editingSub[id]=jj;renderLater();};})();
          srow.appendChild(dot);srow.appendChild(lbl);srow.appendChild(eb);
        }
        subsDiv.appendChild(srow);
      });
      card.appendChild(subsDiv);
    }
    card.appendChild(makeAttPanelLater(t));
    const laterBtnRow=document.createElement('div');laterBtnRow.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:4px';
    // Add side quest (bottom left)
    const sqWidgetLater=makeSQWidgetLater(t.id,'later-'+t.id);sqWidgetLater.style.cssText='margin-top:0;flex:0 0 auto';
    // Delete button (center)
    const laterDelWrap=document.createElement('div');laterDelWrap.style.cssText='display:flex;align-items:center;justify-content:center;flex:1';
    if(confirmDelete===t.id){
      const yes=document.createElement('button');yes.className='del-confirm-yes';yes.textContent='Delete';
      yes.onclick=(()=>{const tid=t.id;return()=>{deleteLaterTask(tid);};})();
      const no=document.createElement('button');no.className='del-confirm-no';no.textContent='Never mind';
      no.onclick=()=>{confirmDelete=null;renderLater();};
      const cf=document.createElement('div');cf.className='del-confirm';cf.appendChild(no);cf.appendChild(yes);
      laterDelWrap.appendChild(cf);
    } else {
      const delBtn=document.createElement('button');delBtn.className='del-btn';
      delBtn.innerHTML='<i class="ti ti-trash" style="font-size:14px"></i>';
      delBtn.onclick=(()=>{const tid=t.id;return()=>{confirmDelete=tid;renderLater();};})();
      laterDelWrap.appendChild(delBtn);
    }
    // Move to NEXT (right)
    const moveNextBtn=document.createElement('button');moveNextBtn.className='move-btn';
    moveNextBtn.style.cssText='margin-top:0;margin-left:0;flex:0 0 auto';
    moveNextBtn.innerHTML='<i class="ti ti-arrow-up" style="font-size:12px"></i>Move to NEXT';
    moveNextBtn.onclick=(()=>{const id=t.id;return()=>{moveToNext(id);};})();
    laterBtnRow.appendChild(sqWidgetLater);laterBtnRow.appendChild(laterDelWrap);laterBtnRow.appendChild(moveNextBtn);
    card.appendChild(laterBtnRow);
    items.appendChild(card);
  });
}

function deleteTask(taskId){
  confirmDelete=null;
  tasks=tasks.filter(t=>t.id!==taskId);
  if(manualOrder)manualOrder=manualOrder.filter(id=>id!==taskId);
  if(currentUser&&isOnline)apiDeleteQuest(taskId).catch(e=>console.warn('delete:',e.message));
  saveLocal();render();showMini('Quest deleted');
}

function deleteLaterTask(taskId){
  confirmDelete=null;
  laterTasks=laterTasks.filter(t=>t.id!==taskId);
  if(laterOrder)laterOrder=laterOrder.filter(id=>id!==taskId);
  saveLater();renderLater();showMini('Quest deleted');
}

function moveToLater(taskId){
  const t=tasks.find(t=>t.id===taskId);if(!t)return;
  // Avoid duplicates
  if(laterTasks.find(x=>x.id===taskId)){
    tasks=tasks.filter(x=>x.id!==taskId);
    if(manualOrder)manualOrder=manualOrder.filter(id=>id!==taskId);
    saveLater();render();return;
  }
  laterTasks.push({...t});
  if(!laterOrder)laterOrder=[];
  laterOrder.push(taskId);
  tasks=tasks.filter(x=>x.id!==taskId);
  if(manualOrder)manualOrder=manualOrder.filter(id=>id!==taskId);
  // Delete from quests table in cloud
  if(currentUser&&isOnline)apiDeleteQuest(taskId).catch(e=>console.warn('moveToLater delete:',e.message));
  saveLater();render();showMini('Moved to LATER');
}

function moveToNext(taskId){
  const t=laterTasks.find(t=>t.id===taskId);if(!t)return;
  // Avoid duplicates
  if(!tasks.find(x=>x.id===taskId)){
    tasks.push({...t});
    if(!manualOrder)manualOrder=[];
    manualOrder.push(taskId);
    // Sync to quests table
    if(currentUser&&isOnline)syncToCloud(taskId).catch(e=>console.warn('moveToNext sync:',e.message));
  }
  laterTasks=laterTasks.filter(x=>x.id!==taskId);
  if(laterOrder)laterOrder=laterOrder.filter(id=>id!==taskId);
  saveLater();render();showMini('Moved to NEXT');
}

function saveLater(){
  saveLocal();
  if(currentUser&&isOnline)apiSaveUserData().catch(e=>console.warn('later sync:',e.message));
}

function render(){
  updateBar();const s=sorted();
  if(!s.length){document.getElementById('active-card').innerHTML='<div style="text-align:center;padding:2rem;color:#bbb;font-size:14px">All quests complete! Add one below.</div>';document.getElementById('peek-items').innerHTML='';}
  else{renderActive(s[0]);renderPeek(s.slice(1));}
  updateToggleBtn();renderDone();renderLater();
}
function submitSQ(taskId,inputId){
  const inp=document.getElementById(inputId);if(!inp)return;
  const txt=inp.value.trim();if(!txt)return;
  const t=tasks.find(t=>t.id===taskId);if(!t)return;
  if(!t.subs)t.subs=[];if(!t.subOrder)t.subOrder=t.subs.map((_,i)=>i);
  t.subs.push({text:txt,done:false});t.subOrder.push(t.subs.length-1);
  openSQ[taskId]=false;save(taskId);gainXP(10);render();showMini(celebSQ[Math.floor(Math.random()*celebSQ.length)]);
}
function completeTop(){
  const s=sorted();if(!s.length)return;
  const top=s[0];
  const assignedEmoji=EMOJIS[completed.length%EMOJIS.length];
  completed.push({text:top.text,id:top.id,emoji:assignedEmoji});
  manualOrder=manualOrder.filter(id=>id!==top.id);
  dirtyIds.add(top.id);
  tasks=tasks.filter(t=>t.id!==top.id);
  delete openSQ[top.id];delete editingSub[top.id];delete openPanel[top.id];
  saveLocal();gainXP(30);if(currentUser&&isOnline)apiSaveUserData().catch(e=>console.warn('completeTop sync:',e.message));showMini(celebDone[Math.floor(Math.random()*celebDone.length)],1800);setTimeout(()=>{syncToCloud(top.id);render();},200);
}
function skipTop(){
  const s=sorted();if(!s.length)return;
  const topId=s[0].id;const idx=manualOrder.indexOf(topId);
  if(idx>-1){manualOrder.splice(idx,1);manualOrder.push(topId);}
  confirmDelete=null;openSQ[topId]=false;saveLocal();if(currentUser&&isOnline)apiSaveUserData().catch(e=>console.warn('skip sync:',e.message));render();showMini('Skipped — moved to back');
}
function addTask(){
  const inp=document.getElementById('new-task');const txt=inp.value.trim();if(!txt)return;
  const t={id:uid(),text:txt,due:'',subs:[],skipped:0,notes:[],links:[]};
  tasks.push(t);if(!manualOrder)manualOrder=[];manualOrder.push(t.id);
  inp.value='';save(t.id);gainXP(10);render();showMini(celebAdd[Math.floor(Math.random()*celebAdd.length)]);
}

document.getElementById('peek-toggle').onclick=function(){peekExpanded=!peekExpanded;render();};
document.getElementById('btn-add').onclick=addTask;
document.getElementById('new-task').onkeydown=function(e){if(e.key==='Enter')addTask();};

document.getElementById('done-recent-toggle').onclick=function(){doneRecentExpanded=!doneRecentExpanded;renderDone();};
document.getElementById('later-toggle').onclick=function(){laterExpanded=!laterExpanded;renderLater();};

document.getElementById('done-earlier-toggle').onclick=function(){doneEarlierExpanded=!doneEarlierExpanded;renderDone();};

// ── Init: restore session from localStorage ──────────────────────────────────
setSyncStatus(isOnline?'offline':'offline');
if(loadSession()){
  showApp();
  setSyncStatus(isOnline?'syncing':'offline');
  if(isOnline){
    loadFromCloud().then(()=>syncAllDirty());
  } else {
    render();
  }
} else {
  showAuth();
}
</script>
